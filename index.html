<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plantão Itaocara</title>
<meta name="description" content="Qual farmácia está de plantão hoje em Itaocara, RJ. Escala de fins de semana e feriados.">
<meta name="theme-color" content="#00874E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: coluna única alinhada à esquerda. Topo = data do plantão com marca-texto (como o cartaz), depois as duas farmácias, depois a escala em tabela de cartaz agrupada por mês. */
:root{
  --papel:#F7F9F8; --superficie:#FFFFFF; --tinta:#13261D; --tinta-2:#4C5F55;
  --verde:#00874E; --on-verde:#FFFFFF; --marca:#E6F03C; --on-marca:#13261D;
  --linha:#C9D3CD; --aviso:#A8321E;
  --f-titulo:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-1:1.0625rem; --t-2:1.3125rem; --t-3:1.75rem; --t-4:2.5rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#0F1A15; --superficie:#16241D; --tinta:#E4EEE8; --tinta-2:#9DB0A5;
  --verde:#35C27F; --on-verde:#062014; --marca:#D9E33A; --on-marca:#13261D;
  --linha:#2B3D34; --aviso:#F08A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#0F1A15; --superficie:#16241D; --tinta:#E4EEE8; --tinta-2:#9DB0A5;
  --verde:#35C27F; --on-verde:#062014; --marca:#D9E33A; --on-marca:#13261D;
  --linha:#2B3D34; --aviso:#F08A6E; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:var(--t-1);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.pagina{max-width:600px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--f-titulo);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:4px}

/* Cabeçalho */
.topo{display:flex;align-items:center;gap:12px}
.cruz{width:36px;height:36px;flex:none}
.cruz path{fill:var(--verde)}
.topo h1{font-size:var(--t-2);font-weight:750;font-stretch:90%}
.topo p{color:var(--tinta-2);font-size:.95rem}

/* Plantão de agora */
.agora{display:flex;flex-direction:column;gap:18px}
.estado{font-weight:700;color:var(--tinta-2)}
.quando{font-size:var(--t-4);font-weight:800;font-stretch:72%;line-height:1.05;letter-spacing:-.005em}
.quando .tinta-marca{color:var(--on-marca);padding:0 .12em;margin:0 -.12em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(100deg,transparent .08em,var(--marca) .2em,var(--marca) calc(100% - .25em),transparent 100%);
  background-repeat:no-repeat;background-size:100% 74%;background-position:0 72%}
.apoio{color:var(--tinta-2)}
.farmacias{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.farmacia{background:var(--superficie);border:1.5px solid var(--linha);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.farmacia h3{font-size:var(--t-3);font-weight:750;font-stretch:85%}
.farmacia .end{color:var(--tinta-2)}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.botao{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;
  font:700 1rem var(--f-texto);text-decoration:none;cursor:pointer;border:1.5px solid var(--verde);color:var(--verde);background:transparent}
.botao svg{width:20px;height:20px;flex:none;fill:currentColor}
.botao.principal{background:var(--verde);color:var(--on-verde)}
.sem-tel{color:var(--tinta-2);font-size:.95rem;align-self:center}
.compartilhar{align-self:flex-start}
.aviso{color:var(--aviso);font-weight:700}

/* Escala */
.escala{display:flex;flex-direction:column;gap:16px}
.escala-topo{display:flex;flex-direction:column;gap:12px}
.escala-topo h2{font-size:var(--t-3);font-weight:750;font-stretch:85%}
.busca{display:flex;flex-direction:column;gap:4px;max-width:360px}
.busca label{font-size:.9rem;color:var(--tinta-2)}
.busca input{font:inherit;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--linha);background:var(--superficie);color:var(--tinta);width:100%}
.resultado{color:var(--tinta-2);font-size:.95rem;min-height:1.5em}
.mes h3{font-size:var(--t-2);font-weight:700;font-stretch:90%;margin-bottom:6px}
.mes h3::first-letter{text-transform:uppercase}
.tabela{list-style:none;margin:0;padding:0;border-top:2px solid var(--tinta)}
.linha{display:grid;grid-template-columns:6.75rem 1fr;border-bottom:1px solid var(--linha)}
.linha > div{padding:10px 0;min-width:0}
.linha .data{border-right:1px solid var(--linha);padding-inline:8px 12px;font-family:var(--f-titulo);font-weight:750;font-stretch:80%;font-size:1.2rem;line-height:1.2;font-variant-numeric:tabular-nums}
.linha .data small{display:block;font-family:var(--f-texto);font-weight:400;font-size:.85rem;color:var(--tinta-2);font-stretch:100%}
.linha .nomes{padding-left:12px}
.linha .nomes > span:not(.selo){display:block}
.selo{display:inline-block;margin-top:4px;font-size:.82rem;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid var(--linha);color:var(--tinta-2)}
.linha.passou{color:var(--tinta-2)}
.linha.destaque{background-image:linear-gradient(100deg,transparent 0,var(--marca) .4em,var(--marca) calc(100% - .6em),transparent 100%);
  background-repeat:no-repeat;background-size:100% 100%;color:var(--on-marca)}
.linha.destaque .data small,.linha.destaque .selo{color:var(--on-marca);border-color:currentColor}
.linha.destaque .data{border-right-color:color-mix(in srgb,var(--on-marca) 30%,transparent)}
.mostrar{align-self:flex-start}
.vazio{color:var(--tinta-2)}


@media (min-width:640px){
  .farmacias{grid-template-columns:1fr 1fr}
  .quando{font-size:3rem}
}
@media (prefers-reduced-motion:no-preference){
  .quando .tinta-marca,.linha.destaque{animation:passar-marca .7s cubic-bezier(.3,.7,.3,1) .15s both}
  .botao{transition:transform .1s}
  .botao:active{transform:scale(.97)}
}
@keyframes passar-marca{from{background-size:0% 74%}to{background-size:100% 74%}}
.linha.destaque{animation-name:passar-linha}
@keyframes passar-linha{from{background-size:0% 100%}to{background-size:100% 100%}}
</style>

<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<meta property="og:title" content="Farmácia de plantão em Itaocara">

</head>
<body>
<div class="pagina">
  <header class="topo">
    <svg class="cruz" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 2h7v6.5H22v7h-6.5V22h-7v-6.5H2v-7h6.5z"/></svg>
    <div>
      <h1>Farmácia de plantão</h1>
      <p>Itaocara, RJ. Fins de semana e feriados.</p>
    </div>
  </header>

  <main class="agora" id="agora" aria-live="polite"></main>

  <section class="escala" aria-labelledby="titulo-escala">
    <div class="escala-topo">
      <h2 id="titulo-escala">Escala</h2>
      <div class="busca">
        <label for="busca">Buscar farmácia</label>
        <input id="busca" type="search" autocomplete="off" placeholder="Ex.: Drogalima">
      </div>
    </div>
    <p class="resultado" id="resultado" aria-live="polite"></p>
    <div id="meses"></div>
    <button class="botao mostrar" id="mostrar" type="button"></button>
  </section>

</div>

<script>
// Endereço do site publicado, usado no texto do WhatsApp. Deixe vazio enquanto não houver.
const SITE = "https://dibmartins.github.io/plantao-itaocara/";

// Contatos confirmados no Google Maps. Quem não tem telefone cai numa busca no mapa.
const CONTATOS = {
  "Drogalima": {end:"R. Nilo Peçanha, 242, Centro", tel:"(22) 3861-2531"},
  "Farmácia 4 Esquinas": {tel:"(22) 3861-3021"},
  "Farmácia Avenida": {end:"R. Pastor José Henrique da Mata, 529"},
  "Drogaria do Povo": {end:"R. Aristides Scisínio, 81, Centro", tel:"(22) 98171-5564"},
  "Farmácia Ayrão": {end:"R. Nilo Peçanha, 500, Cidade Nova", tel:"(22) 3861-2083"},
  "Drogaria Ideal": {end:"Av. Roberto Silveira, 501, Centro", tel:"(22) 3861-3428"},
  "Farma Nossa": {end:"Av. Roberto Silveira, 561, Cidade Nova", tel:"(22) 98117-3592"},
  "Fort Popular": {end:"R. Walter Luiz Rimes, 89, Centro", tel:"(22) 98154-1153"},
  "Farmácia Itaocara": {end:"R. Nilo Peçanha, 122, Centro", tel:"(22) 3861-2219"},
  "Drogaria Descontão": {end:"R. Benedito Pereira de Souza, 149, Centro", tel:"(22) 3861-3713"},
  "Farmácia Casa Branca": {end:"R. Nilo Peçanha, 549, Centro", tel:"(22) 98133-8982"},
  "Farmácia Martins": {end:"R. Nilo Peçanha, 561, Centro", tel:"(22) 3861-2732"},
  "Drogaria Soares": {end:"Centro", tel:"(22) 3861-2990"}
};

// Escala do cartaz: datas, as duas farmácias e, quando houver, o motivo do plantão.
const ESCALA = [
  {d:["2026-09-07"], f:["Única Farma","Farmácia Casa Branca"], selo:"Independência"},
  {d:["2026-09-12","2026-09-13"], f:["Nova Droga Ita","Drogaria Ideal"]},
  {d:["2026-09-19","2026-09-20"], f:["Farmácia Jardim d'Aldeia","Drogaria Descontão"]},
  {d:["2026-09-26","2026-09-27"], f:["Farmácia 2 Irmãos","Farmácia Amaral"]},
  {d:["2026-10-03","2026-10-04"], f:["Farma Pop","Fort Popular"]},
  {d:["2026-10-10","2026-10-11"], f:["Drogalima","Farmácia Martins"]},
  {d:["2026-10-12"], f:["Drogaria Soares","Farma Nossa"], selo:"Nossa Senhora Aparecida"},
  {d:["2026-10-17","2026-10-18"], f:["Farmácia 4 Esquinas","Farmácia Avenida"]},
  {d:["2026-10-24","2026-10-25"], f:["Farmácia Pop Farma","Drogaria do Povo"]},
  {d:["2026-10-28"], f:["Farmácia Itaocara","Farmácia Ayrão"], selo:"Dia do Servidor Público"},
  {d:["2026-10-31","2026-11-01"], f:["Drogaria Capil","Farmácia Casa Branca"]},
  {d:["2026-11-02"], f:["Única Farma","Drogaria Ideal"], selo:"Finados"},
  {d:["2026-11-07","2026-11-08"], f:["Nova Droga Ita","Drogaria Descontão"]},
  {d:["2026-11-14","2026-11-15"], f:["Farmácia Jardim d'Aldeia","Farmácia Amaral"], selo:"Proclamação da República"},
  {d:["2026-11-20"], f:["Farmácia 2 Irmãos","Fort Popular"], selo:"Consciência Negra"},
  {d:["2026-11-21","2026-11-22"], f:["Farma Pop","Farmácia Martins"]},
  {d:["2026-11-28","2026-11-29"], f:["Drogalima","Farma Nossa"]},
  {d:["2026-12-05","2026-12-06"], f:["Drogaria Soares","Farmácia Avenida"]},
  {d:["2026-12-12","2026-12-13"], f:["Farmácia 4 Esquinas","Drogaria do Povo"]},
  {d:["2026-12-19","2026-12-20"], f:["Farmácia Pop Farma","Farmácia Ayrão"]},
  {d:["2026-12-25"], f:["Farmácia Itaocara","Farmácia Casa Branca"], selo:"Natal"},
  {d:["2026-12-26","2026-12-27"], f:["Drogaria Capil","Drogaria Ideal"]},
  {d:["2027-01-01"], f:["Única Farma","Drogaria Descontão"], selo:"Ano-novo"},
  {d:["2027-01-02","2027-01-03"], f:["Nova Droga Ita","Farmácia Amaral"]},
  {d:["2027-01-09","2027-01-10"], f:["Farmácia Jardim d'Aldeia","Fort Popular"]},
  {d:["2027-01-16","2027-01-17"], f:["Farmácia 2 Irmãos","Farmácia Martins"]},
  {d:["2027-01-23","2027-01-24"], f:["Farma Pop","Farma Nossa"]},
  {d:["2027-01-30","2027-01-31"], f:["Drogalima","Farmácia Avenida"]},
  {d:["2027-02-04"], f:["Drogaria Soares","Drogaria do Povo"], selo:"Plantão extra"},
  {d:["2027-02-06","2027-02-07"], f:["Farmácia 4 Esquinas","Farmácia Ayrão"]},
  {d:["2027-02-08","2027-02-09"], f:["Farmácia Pop Farma","Farmácia Casa Branca"], selo:"Carnaval"},
  {d:["2027-02-13","2027-02-14"], f:["Farmácia Itaocara","Drogaria Ideal"]},
  {d:["2027-02-20","2027-02-21"], f:["Drogaria Capil","Drogaria Descontão"]},
  {d:["2027-02-27","2027-02-28"], f:["Única Farma","Farmácia Amaral"]}
];

// "Hoje" no horário de Brasília. Para testar outra data, abra a página com #2026-10-17 no fim do link.
const forcado = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
const HOJE = forcado ? forcado[1]
  : new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());

const utc = iso => new Date(iso+"T12:00:00Z");
const fmt = (iso,op) => utc(iso).toLocaleDateString("pt-BR",{timeZone:"UTC",...op});
const semana = iso => fmt(iso,{weekday:"long"}).replace("-feira","");
const semanaCurta = iso => fmt(iso,{weekday:"short"}).replace(".","");
const dia = iso => { const n = +iso.slice(8); return n===1 ? "1º" : String(n); };
const mes = iso => fmt(iso,{month:"long"});
const diasAte = iso => Math.round((utc(iso)-utc(HOJE))/864e5);
const ultimo = e => e.d[e.d.length-1];

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function semAcento(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }

// "Sábado 17 e domingo 18 de outubro" / "Sábado 31 de outubro e domingo 1º de novembro"
function porExtenso(datas){
  if(datas.length===1) return cap(`${semana(datas[0])}, ${dia(datas[0])} de ${mes(datas[0])}`);
  const [a,b] = [datas[0], datas[datas.length-1]];
  if(mes(a)===mes(b)) return cap(`${semana(a)} ${dia(a)} e ${semana(b)} ${dia(b)} de ${mes(b)}`);
  return cap(`${semana(a)} ${dia(a)} de ${mes(a)} e ${semana(b)} ${dia(b)} de ${mes(b)}`);
}

const ICONE = {
  tel:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  mapa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
  zap:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .3-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.4.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c0 .2.1.4 0 .5l-.3.5-.4.5c-.2.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'
};

function cartao(nome){
  const c = CONTATOS[nome] || {};
  const digitos = c.tel ? c.tel.replace(/\D/g,"") : "";
  const celular = digitos.length===11 && digitos[2]==="9";
  const mapa = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(`${nome} ${c.end||""} Itaocara RJ`);
  return `<li class="farmacia">
    <h3>${esc(nome)}</h3>
    ${c.end ? `<p class="end">${esc(c.end)}</p>` : ""}
    <div class="acoes">
      ${c.tel ? `<a class="botao principal" href="tel:+55${digitos}">${ICONE.tel}Ligar ${esc(c.tel)}</a>` : `<span class="sem-tel">Telefone não cadastrado</span>`}
      ${celular ? `<a class="botao" href="https://wa.me/55${digitos}" target="_blank" rel="noopener">${ICONE.zap}WhatsApp</a>` : ""}
      <a class="botao" href="${mapa}" target="_blank" rel="noopener">${ICONE.mapa}Como chegar</a>
    </div>
  </li>`;
}

function mensagem(e){
  const quem = e.f.map(n => CONTATOS[n]?.tel ? `${n} ${CONTATOS[n].tel}` : n).join(" e ");
  return `Farmácias de plantão em Itaocara, ${porExtenso(e.d).toLowerCase()}: ${quem}.` + (SITE ? ` Escala completa: ${SITE}` : "");
}

function renderAgora(){
  const el = document.getElementById("agora");
  const atual = ESCALA.find(e => e.d.includes(HOJE));
  const prox = ESCALA.find(e => e.d[0] > HOJE);
  const e = atual || prox;
  if(!e){
    el.innerHTML = `<p class="aviso">A escala cadastrada terminou em 28 de fevereiro de 2027.</p>
      <p class="apoio">Assim que o cartaz novo sair, a página será atualizada.</p>`;
    return null;
  }
  let estado, apoio = "";
  if(atual){
    estado = "De plantão hoje";
    const resto = atual.d.filter(d => d > HOJE);
    if(resto.length) apoio = `As mesmas farmácias seguem de plantão ${semana(resto[0])}, ${dia(resto[0])}.`;
  } else {
    const n = diasAte(e.d[0]);
    estado = n===1 ? "Hoje não há plantão. O próximo começa amanhã." : `Hoje não há plantão. O próximo começa em ${n} dias.`;
    apoio = "Em dias úteis, todas as farmácias abrem no horário normal.";
  }
  if(e.selo) apoio = `${e.selo}. ${apoio}`.trim();
  const quando = atual ? cap(`${semana(HOJE)}, ${dia(HOJE)} de ${mes(HOJE)}`) : porExtenso(e.d);
  el.innerHTML = `
    <p class="estado">${estado}</p>
    <h2 class="quando"><span class="tinta-marca">${esc(quando)}</span></h2>
    ${apoio ? `<p class="apoio">${esc(apoio)}</p>` : ""}
    <ul class="farmacias">${e.f.map(cartao).join("")}</ul>
    <a class="botao compartilhar" href="https://wa.me/?text=${encodeURIComponent(mensagem(e))}" target="_blank" rel="noopener">${ICONE.zap}Enviar no WhatsApp</a>`;
  return e;
}

let mostrarPassadas = false;
function renderEscala(destaque){
  const termo = semAcento(document.getElementById("busca").value.trim());
  const visiveis = ESCALA.filter(e =>
    (mostrarPassadas || termo || ultimo(e) >= HOJE) &&
    (!termo || e.f.some(n => semAcento(n).includes(termo))));

  const grupos = [];
  for(const e of visiveis){
    const chave = e.d[0].slice(0,7);
    let g = grupos[grupos.length-1];
    if(!g || g.chave!==chave){ g = {chave, itens:[]}; grupos.push(g); }
    g.itens.push(e);
  }

  document.getElementById("meses").innerHTML = grupos.map(g => `
    <section class="mes">
      <h3>${mes(g.chave+"-01")} de ${g.chave.slice(0,4)}</h3>
      <ol class="tabela">${g.itens.map(e => {
        const a = e.d[0], b = ultimo(e);
        const datas = e.d.length===1 ? dia(a) : (a.slice(5,7)===b.slice(5,7) ? `${dia(a)} e ${dia(b)}` : `${dia(a)} e ${dia(b)}/${b.slice(5,7)}`);
        const cls = [b < HOJE ? "passou" : "", e===destaque ? "destaque" : ""].join(" ").trim();
        return `<li class="linha ${cls}" aria-label="${esc(porExtenso(e.d))}: ${esc(e.f.join(" e "))}">
          <div class="data">${datas}<small>${e.d.map(semanaCurta).join(" e ")}</small></div>
          <div class="nomes">${e.f.map(n => `<span>${esc(n)}</span>`).join("")}${e.selo ? `<span class="selo">${esc(e.selo)}</span>` : ""}</div>
        </li>`;}).join("")}
      </ol>
    </section>`).join("") || `<p class="vazio">Nenhuma farmácia com esse nome na escala. Confira a grafia, por exemplo "Drogaria Ideal".</p>`;

  const res = document.getElementById("resultado");
  if(termo){
    const futuras = visiveis.filter(e => ultimo(e) >= HOJE).length;
    res.textContent = visiveis.length ? `${visiveis.length} ${visiveis.length===1?"data":"datas"} na escala, ${futuras} ainda por vir.` : "";
  } else res.textContent = "";

  const btn = document.getElementById("mostrar");
  btn.hidden = !!termo || !ESCALA.some(e => ultimo(e) < HOJE);
  btn.textContent = mostrarPassadas ? "Esconder datas que já passaram" : "Mostrar datas que já passaram";
}

const destaque = renderAgora();
renderEscala(destaque);
document.getElementById("busca").addEventListener("input", () => renderEscala(destaque));
document.getElementById("mostrar").addEventListener("click", () => { mostrarPassadas = !mostrarPassadas; renderEscala(destaque); });

// Guarda a página para abrir mesmo sem internet.
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
